<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Warehouse – Scan READY</title>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin:0; background:#0f172a; color:#e5e7eb; }
    header { padding:12px 16px; background:#020617; border-bottom:1px solid #1e293b; }
    header h1 { font-size:18px; margin:0; }
    header .row { display:flex; gap:10px; align-items:center; margin-top:6px; flex-wrap:wrap; }
    .pill { font-size:13px; padding:6px 10px; border-radius:999px; background:#111827; border:1px solid #334155; color:#cbd5e1; }
    .pill strong { color:#fff; }

    main { padding:12px; }
    .camera-wrap { position: relative; width: 100%; }
    video { width:100%; max-height:55vh; background:black; border-radius:10px; display:block; }
    canvas#overlay { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }

    .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    button {
      padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#111827;
      color:#e5e7eb; font-size:14px; cursor:pointer;
    }
    button.primary { background:#2563eb; border-color:#1d4ed8; }
    button.good { background:#16a34a; border-color:#15803d; }
    input {
      padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0b1220;
      color:#e5e7eb; font-size:14px; min-width: 220px;
    }
    .hint { margin-top:10px; font-size:14px; color:#94a3b8; }

    /* Error modal */
    .modal { position:fixed; inset:0; background:rgba(2,6,23,0.85); display:none; align-items:center; justify-content:center; z-index:1000; }
    .modal-content { background:#020617; border:1px solid #334155; border-radius:10px; padding:18px; max-width:420px; text-align:center; }
    .modal-content h2 { margin:0 0 8px; color:#ef4444; }
    .modal-content p { margin:0; color:#cbd5e1; white-space:pre-wrap; }
    .modal-content button { margin-top:12px; background:#ef4444; border:none; }

    /* Success toast */
    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      background: rgba(2, 6, 23, 0.92);
      border: 1px solid #14532d;
      color: #dcfce7;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      z-index: 1100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#22c55e; margin-right:8px; vertical-align:middle; }
  </style>
</head>

<body>
<header>
  <h1>📦 Scan READY</h1>
  <div class="row">
    <span class="pill">Today Ready: <strong id="readyCount">—</strong></span>
    <span class="pill">Scanner: <strong id="scannerStatus">starting…</strong></span>
    <span class="pill">Last AWB: <strong id="lastAwb">—</strong></span>
  </div>
</header>

<main>
  <div class="camera-wrap">
    <video id="camera" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="controls">
    <button class="good" id="enableSound">Enable Sound</button>
    <input id="manualAwb" placeholder="Manual AWB (fallback)" />
    <button class="primary" id="manualSubmit">Submit</button>
    <button id="restartCam">Restart Camera</button>
  </div>

  <div class="hint">
    ZXing camera scan. No time cooldown. It re-arms after barcode disappears once (prevents API spam).
  </div>
</main>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<div class="modal" id="errorModal">
  <div class="modal-content">
    <h2>Scan Error</h2>
    <p id="errorMessage"></p>
    <button onclick="closeError()">OK</button>
  </div>
</div>

<script type="module">
/* =========================================================
   CONFIG – CHANGE ONLY THESE
   ========================================================= */
const API_BASE_URL = "https://pzgnggkanppnwnkjgwrm.supabase.co/functions/v1";
const SCAN_READY_ENDPOINT = "/warehouse_scan_ready";
const READY_COUNT_TODAY_ENDPOINT = "/warehouse_ready_count_today";

const SCAN_APP_TOKEN = "ready_scan_4117";
const OPERATOR_NAME = "warehouse_user_1";

/**
 * IMPORTANT:
 * No "cooldown" timer. We prevent spam by requiring the barcode to disappear once
 * before accepting the same value again.
 */
const MIN_AWB_LEN = 6;
const MAX_AWB_LEN = 30;

// ZXing ESM import (reliable)
import { BrowserMultiFormatReader, NotFoundException } from "https://unpkg.com/@zxing/browser@0.1.5/esm/index.min.js";
/* ========================================================= */

let streamTrack = null;
let reader = null;

let overlayCanvas = document.getElementById("overlay");
let overlayCtx = overlayCanvas.getContext("2d");

// Re-arm logic
let lastSeenValue = "";
let armed = true;              // if true, next detected barcode can fire submit
let inFlight = false;          // prevents concurrent API calls

// Sound
let audioCtx = null;

function setScannerStatus(s) { document.getElementById("scannerStatus").textContent = s; }
function setLastAwb(s) { document.getElementById("lastAwb").textContent = s || "—"; }
function setCounter(val) { document.getElementById("readyCount").innerText = String(val); }
function incrementCounter() {
  const el = document.getElementById("readyCount");
  const current = parseInt(el.innerText || "0", 10);
  el.innerText = isNaN(current) ? 1 : current + 1;
}

function showError(msg) {
  document.getElementById("errorMessage").innerText = msg;
  document.getElementById("errorModal").style.display = "flex";
}
window.closeError = function closeError() {
  document.getElementById("errorModal").style.display = "none";
};

function showToast(text) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").innerText = text;
  t.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.style.display = "none", 900);
}

function normalizeAwb(raw) {
  if (!raw) return "";
  const s = String(raw).trim().replace(/\s+/g, "");
  const cleaned = s.replace(/[^A-Za-z0-9\-_]/g, "");
  if (cleaned.length < MIN_AWB_LEN || cleaned.length > MAX_AWB_LEN) return "";
  return cleaned;
}

function syncOverlayToVideo() {
  const video = document.getElementById("camera");
  const vw = video.videoWidth || video.clientWidth;
  const vh = video.videoHeight || video.clientHeight;
  overlayCanvas.width = vw;
  overlayCanvas.height = vh;
}

function clearOverlay() {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
}

function drawOverlayFromPoints(points) {
  // points: [{x,y}...]
  if (!points || !points.length) return;
  clearOverlay();

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of points) {
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x);
    maxY = Math.max(maxY, p.y);
  }
  const w = maxX - minX;
  const h = maxY - minY;

  overlayCtx.lineWidth = 4;
  overlayCtx.strokeStyle = "rgba(34,197,94,0.95)";
  overlayCtx.fillStyle = "rgba(34,197,94,0.12)";
  overlayCtx.strokeRect(minX, minY, w, h);
  overlayCtx.fillRect(minX, minY, w, h);
}

function beepSuccess() {
  // Requires user to tap "Enable Sound" once
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.value = 980;
    g.gain.value = 0.08;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    setTimeout(() => { o.stop(); }, 90);
  } catch {}
}

document.getElementById("enableSound").addEventListener("click", async () => {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioCtx();
    await audioCtx.resume(); // unlock
    showToast("Sound enabled ✅");
    document.getElementById("enableSound").disabled = true;
    document.getElementById("enableSound").innerText = "Sound ON";
  } catch {
    showError("Unable to enable sound on this device/browser.");
  }
});

async function loadTodayReadyCount() {
  try {
    const res = await fetch(API_BASE_URL + READY_COUNT_TODAY_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Scan-Token": SCAN_APP_TOKEN
      },
      body: JSON.stringify({})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.message || `HTTP ${res.status}`);
    const n = Number(data?.ready_today);
    setCounter(Number.isFinite(n) ? n : "—");
  } catch {
    setCounter("—");
  }
}

async function submitScan(awb) {
  if (inFlight) return; // avoid double API calls if camera sees multiple quickly
  inFlight = true;

  setLastAwb(awb);

  try {
    const res = await fetch(API_BASE_URL + SCAN_READY_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Scan-Token": SCAN_APP_TOKEN
      },
      body: JSON.stringify({ awb, operator: OPERATOR_NAME })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) throw new Error(data?.message || `HTTP ${res.status}`);
    if (data?.result && data.result !== "ACCEPTED") {
      // This is where your duplicate scan / already READY errors will show
      throw new Error(data.message || "Scan rejected");
    }

    // success feedback
    incrementCounter();
    beepSuccess();
    if (navigator.vibrate) navigator.vibrate(40);
    showToast(`ACCEPTED: ${awb}`);

  } catch (err) {
    showError(err?.message || "Unknown error");
  } finally {
    inFlight = false;
  }
}

async function startZXing() {
  setScannerStatus("requesting camera…");

  const video = document.getElementById("camera");
  reader = new BrowserMultiFormatReader();

  // ZXing handles camera itself, but we use its stream (internally)
  // decodeFromVideoDevice will keep scanning
  setScannerStatus("zxing scan ON");

  await reader.decodeFromVideoDevice(
    undefined, // default camera (usually back camera on mobile)
    video,
    async (result, err, controls) => {
      // Save track for stopping later
      try {
        const tracks = video?.srcObject?.getTracks?.();
        if (tracks && tracks[0]) streamTrack = tracks[0];
      } catch {}

      // Keep overlay synced
      if (video.videoWidth) syncOverlayToVideo();

      if (result) {
        // Outline: use resultPoints if present
        const pts = result.getResultPoints?.();
        if (pts && pts.length) {
          drawOverlayFromPoints(pts.map(p => ({ x: p.getX(), y: p.getY() })));
        }

        const raw = result.getText?.() || "";
        const awb = normalizeAwb(raw);

        if (!awb) return;

        // Re-arm logic:
        // - If barcode is still the same and not "armed", don't submit again.
        // - It becomes armed again only when barcode disappears (NotFound) OR a different barcode appears.
        if (awb !== lastSeenValue) {
          lastSeenValue = awb;
          armed = true; // new value → allow submit
        }

        if (armed) {
          armed = false; // fire once for this appearance
          await submitScan(awb);
        }

      } else if (err) {
        // When nothing is detected, ZXing usually throws NotFoundException
        if (err instanceof NotFoundException) {
          clearOverlay();
          // Barcode disappeared → re-arm
          armed = true;
          return;
        }

        // Other errors: ignore (don’t spam)
      }
    }
  );
}

document.getElementById("restartCam").addEventListener("click", async () => {
  try {
    clearOverlay();
    armed = true;
    lastSeenValue = "";
    if (reader) reader.reset();
    await startZXing();
  } catch (e) {
    showError("Restart failed. " + (e?.message || e));
  }
});

// Manual submit
document.getElementById("manualSubmit").addEventListener("click", async () => {
  const raw = document.getElementById("manualAwb").value;
  const awb = normalizeAwb(raw);
  if (!awb) return showError("Invalid AWB.");
  document.getElementById("manualAwb").value = "";
  // allow same again
  lastSeenValue = "";
  armed = true;
  await submitScan(awb);
});
document.getElementById("manualAwb").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("manualSubmit").click();
});

// Init
loadTodayReadyCount();
startZXing().catch(err => showError("Camera start failed: " + (err?.message || err)));
</script>
</body>
</html>
