<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Warehouse – Scan READY</title>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin:0; background:#0f172a; color:#e5e7eb; }
    header { padding:12px 16px; background:#020617; border-bottom:1px solid #1e293b; }
    header h1 { font-size:18px; margin:0; }
    header .row { display:flex; gap:12px; align-items:center; margin-top:6px; flex-wrap:wrap; }
    .pill { font-size:13px; padding:6px 10px; border-radius:999px; background:#111827; border:1px solid #334155; color:#cbd5e1; }
    .pill strong { color:#fff; }

    main { padding:12px; }
    #reader { width:100%; max-width:720px; margin:0 auto; }
    .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
    button {
      padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#111827;
      color:#e5e7eb; font-size:14px; cursor:pointer;
    }
    button.primary { background:#2563eb; border-color:#1d4ed8; }
    input {
      padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0b1220;
      color:#e5e7eb; font-size:14px; min-width: 220px;
    }
    .hint { margin-top:10px; font-size:14px; color:#94a3b8; text-align:center; }

    /* Error modal */
    .modal { position:fixed; inset:0; background:rgba(2,6,23,0.85); display:none; align-items:center; justify-content:center; z-index:1000; }
    .modal-content { background:#020617; border:1px solid #334155; border-radius:10px; padding:18px; max-width:380px; text-align:center; }
    .modal-content h2 { margin:0 0 8px; color:#ef4444; }
    .modal-content p { margin:0; color:#cbd5e1; white-space:pre-wrap; }
    .modal-content button { margin-top:12px; background:#ef4444; border:none; }

    /* Success toast */
    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      background: rgba(2, 6, 23, 0.92);
      border: 1px solid #14532d;
      color: #dcfce7;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      z-index: 1100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#22c55e; margin-right:8px; vertical-align:middle; }
  </style>
</head>

<body>
<header>
  <h1>📦 Scan READY</h1>
  <div class="row">
    <span class="pill">Today Ready: <strong id="readyCount">0</strong></span>
    <span class="pill">Scanner: <strong id="scannerStatus">idle</strong></span>
    <span class="pill">Last AWB: <strong id="lastAwb">—</strong></span>
  </div>
</header>

<main>
  <div id="reader"></div>

  <div class="controls">
    <button class="primary" id="startBtn">Start Camera</button>
    <button id="stopBtn" disabled>Stop</button>
    <input id="manualAwb" placeholder="Manual AWB (fallback)" />
    <button id="manualSubmit">Submit</button>
  </div>

  <div class="hint">
    Tip: Scan box/outline will show automatically. Duplicate scans are allowed (backend will reject if already READY).
  </div>
</main>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<div class="modal" id="errorModal">
  <div class="modal-content">
    <h2>Scan Error</h2>
    <p id="errorMessage"></p>
    <button onclick="closeError()">OK</button>
  </div>
</div>

<!-- Beep sound (tiny beep). Needs user gesture to unlock -->
<audio id="beep" preload="auto"
  src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="></audio>

<!-- html5-qrcode -->
<script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

<script>
/* =========================================================
   CONFIG – CHANGE ONLY THESE
   ========================================================= */
const API_BASE_URL = "https://pzgnggkanppnwnkjgwrm.supabase.co/functions/v1";
const SCAN_READY_ENDPOINT = "/warehouse_scan_ready";
const SCAN_APP_TOKEN = "ready_scan_4117";
const OPERATOR_NAME = "warehouse_user_1";

/* scanning settings */
const FPS = 15;
const QRBOX = { width: 260, height: 160 }; // scan box size (outline)
const MIN_AWB_LEN = 6;
const MAX_AWB_LEN = 30;
/* ========================================================= */

let html5Qr = null;

// re-arm by disappear (no time cooldown)
let lastSeen = "";
let armed = true;
let inFlight = false;

function setScannerStatus(s){ document.getElementById("scannerStatus").innerText = s; }
function setLastAwb(s){ document.getElementById("lastAwb").innerText = s || "—"; }
function incrementCounter(){
  const el = document.getElementById("readyCount");
  el.innerText = String((parseInt(el.innerText || "0", 10) || 0) + 1);
}

function showToast(text){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").innerText = text;
  t.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.style.display = "none", 900);
}

function showError(msg){
  document.getElementById("errorMessage").innerText = msg;
  document.getElementById("errorModal").style.display = "flex";
}
function closeError(){ document.getElementById("errorModal").style.display = "none"; }

function normalizeAwb(raw){
  if (!raw) return "";
  const s = String(raw).trim().replace(/\s+/g, "");
  const cleaned = s.replace(/[^A-Za-z0-9\-_]/g, "");
  if (cleaned.length < MIN_AWB_LEN || cleaned.length > MAX_AWB_LEN) return "";
  return cleaned;
}

function beepSuccess(){
  const beep = document.getElementById("beep");
  try {
    beep.currentTime = 0;
    beep.play().catch(()=>{});
  } catch {}
}

async function submitScan(awb){
  if (inFlight) return;
  inFlight = true;

  setLastAwb(awb);

  try {
    const res = await fetch(API_BASE_URL + SCAN_READY_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Scan-Token": SCAN_APP_TOKEN
      },
      body: JSON.stringify({ awb, operator: OPERATOR_NAME })
    });

    const data = await res.json().catch(()=> ({}));

    if (!res.ok) throw new Error(data?.message || `HTTP ${res.status}`);
    if (data?.result && data.result !== "ACCEPTED") throw new Error(data.message || "Scan rejected");

    incrementCounter();
    beepSuccess();
    if (navigator.vibrate) navigator.vibrate(40);
    showToast(`ACCEPTED: ${awb}`);

  } catch (e) {
    showError(e?.message || "Failed");
  } finally {
    inFlight = false;
  }
}

async function startCamera(){
  // unlock audio on user click
  beepSuccess();

  document.getElementById("startBtn").disabled = true;
  setScannerStatus("starting camera…");

  try {
    if (!html5Qr) html5Qr = new Html5Qrcode("reader");

    // Prefer back camera
    const config = {
      fps: FPS,
      qrbox: QRBOX,
      aspectRatio: 1.777,
      // Support barcodes too:
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ]
    };

    await html5Qr.start(
      { facingMode: "environment" },
      config,
      async (decodedText) => {
        // decodedText fired repeatedly while code is in frame
        const awb = normalizeAwb(decodedText);
        if (!awb) return;

        // re-arm logic (NO time cooldown)
        if (awb !== lastSeen) {
          lastSeen = awb;
          armed = true;
        }
        if (armed) {
          armed = false;
          await submitScan(awb);
        }
      },
      (errMsg) => {
        // When nothing is found, this callback is spammy; we can use it to re-arm
        // It’s not a "real error", so don’t popup.
        armed = true; // code disappeared -> allow same again
      }
    );

    setScannerStatus("running");
    document.getElementById("stopBtn").disabled = false;

  } catch (e) {
    setScannerStatus("blocked");
    document.getElementById("startBtn").disabled = false;

    // This will show REAL camera permission / https / device errors
    showError("Camera start failed:\n" + (e?.message || e));
  }
}

async function stopCamera(){
  try {
    if (html5Qr) await html5Qr.stop();
    setScannerStatus("stopped");
  } catch {}
  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
}

document.getElementById("startBtn").addEventListener("click", startCamera);
document.getElementById("stopBtn").addEventListener("click", stopCamera);

document.getElementById("manualSubmit").addEventListener("click", async () => {
  const raw = document.getElementById("manualAwb").value;
  const awb = normalizeAwb(raw);
  if (!awb) return showError("Invalid AWB.");
  document.getElementById("manualAwb").value = "";
  lastSeen = "";
  armed = true;
  await submitScan(awb);
});
document.getElementById("manualAwb").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("manualSubmit").click();
});
</script>
</body>
</html>
